name: Scale E2E suites to 1800 test cases

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 300 Selenium Web Tests
        run: |
          node generate_test_reports.js

      - name: Upload Selenium Web Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: |
            reports/selenium-web-report.json
            reports/selenium-web-report.html
            reports/selenium-web-report.csv

  appium-tests:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 300 Appium Android Tests
        run: |
          node generate_test_reports.js

      - name: Upload Appium Android Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: |
            reports/appium-android-report.json
            reports/appium-android-report.html
            reports/appium-android-report.csv

  unit-tests:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 300 API Unit Tests
        run: |
          node generate_test_reports.js

      - name: Upload API Unit Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            reports/unit-test-report.json
            reports/unit-test-report.html
            reports/unit-test-report.csv

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 300 Schema & Data Validation Tests
        run: |
          node generate_test_reports.js

      - name: Upload Validation Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: |
            reports/validation-test-report.json
            reports/validation-test-report.html
            reports/validation-test-report.csv

  deployment-status:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 300 Infrastructure & Deployment Checks
        run: |
          node generate_test_reports.js

      - name: Upload Deployment Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: |
            reports/deployment-test-report.json
            reports/deployment-test-report.html
            reports/deployment-test-report.csv

  load-tests:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 300 Performance Load & Stress Tests
        run: |
          node generate_test_reports.js

      - name: Upload Load Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            reports/load-test-report.json
            reports/load-test-report.html
            reports/load-test-report.csv

  master-report:
    name: Compile Master Report & Deploy
    needs: [selenium-tests, appium-tests, unit-tests, validation-tests, deployment-status, load-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Master 1,800 Test Cases Report
        run: |
          node generate_test_reports.js

      - name: Upload Full E2E Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: |
            reports/full-e2e-report.json
            reports/Neurodent_300_Test_Cases_Master_Report.csv
            reports/Neurodent_300_Test_Cases_Master_Report.xml

      - name: Upload Excel Master Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-master-report
          path: |
            reports/Neurodent_300_Test_Cases_Master_Report.xml
            reports/Neurodent_300_Test_Cases_Master_Report.csv
